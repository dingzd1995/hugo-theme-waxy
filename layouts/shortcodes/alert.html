{{- $style := .Get "style" | default "success" -}}
{{- $closeable := eq (.Get "close") "true" -}}
<div class="alert alert--{{ $style }}{{ if $closeable }} alert--dismissible{{ end }}" role="alert">{{ if $closeable }}<button type="button" class="alert__close" data-action="alert-close" aria-label="关闭">&times;</button>{{ end }}{{ .Inner }}</div>
